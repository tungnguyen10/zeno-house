name: Release

on:
  status:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged into main (for example, 1.0.7)
        required: true
        type: string
      commit:
        description: Full SHA of the main commit that introduced the version
        required: true
        type: string

concurrency:
  group: release-${{ inputs.commit || github.event.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag and publish the approved version
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'status' && github.event.sender.login == 'vercel[bot]' &&
       github.event.state == 'success' && github.event.context == 'Vercel' &&
       github.event.description == 'Deployment has completed' &&
       startsWith(github.event.target_url, 'https://vercel.com/zenocorp/zeno-house/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit || github.event.sha }}
      RELEASE_EVENT: ${{ github.event_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the version bump on main
        id: verify
        shell: bash
        run: |
          if [[ "$RELEASE_EVENT" == status ]]; then
            if [[ ! "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] ||
               ! git rev-list --first-parent HEAD | grep -Fx "$RELEASE_COMMIT" > /dev/null; then
              echo "Deployment is outside the first-parent history of main."
              exit 0
            fi
            version_at() {
              git show "$1:package.json" | node -pe "JSON.parse(require('fs').readFileSync(0)).version"
            }
            RELEASE_VERSION="$(version_at "$RELEASE_COMMIT")"
            if [[ "$(version_at "${RELEASE_COMMIT}^")" == "$RELEASE_VERSION" ]]; then
              echo "Deployment does not introduce a new version."
              exit 0
            fi
            export RELEASE_VERSION
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ||
                ! "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Provide a stable version and a full lowercase commit SHA."
            exit 1
          fi

          if ! git rev-list --first-parent HEAD | grep -Fx "$RELEASE_COMMIT" > /dev/null; then
            echo "::error::The selected commit is not on the first-parent history of main."
            exit 1
          fi

          git show "$RELEASE_COMMIT:package.json" > "$RUNNER_TEMP/release-package.json"
          git show "$RELEASE_COMMIT:package-lock.json" > "$RUNNER_TEMP/release-lock.json"
          git show "${RELEASE_COMMIT}^:package.json" > "$RUNNER_TEMP/previous-package.json"
          git show "HEAD:package.json" > "$RUNNER_TEMP/main-package.json"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (file) => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, file), 'utf8'));
          const expected = process.env.RELEASE_VERSION;
          const manifest = read('release-package.json');
          const lock = read('release-lock.json');

          if ([manifest.version, lock.version, lock.packages?.['']?.version]
              .some((version) => version !== expected)) {
            throw new Error('The selected commit and its lockfile must agree on the release version.');
          }

          if (read('previous-package.json').version === expected) {
            throw new Error('Choose the main commit that introduced the release version.');
          }
          NODE
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$(node -p "require(process.argv[1]).version === process.env.RELEASE_VERSION" "$RUNNER_TEMP/main-package.json")" >> "$GITHUB_OUTPUT"

      - name: Publish from the verified tag
        if: steps.verify.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
          MARK_LATEST: ${{ steps.verify.outputs.latest }}
        run: |
          tag="v$RELEASE_VERSION"
          repo="repos/$GITHUB_REPOSITORY"

          read_tag() {
            gh api "$repo/git/matching-refs/tags/$tag" --jq \
              ".[] | select(.ref == \"refs/tags/$tag\") | [.object.type, .object.sha] | @tsv"
          }

          verify_tag() {
            local ref_type ref_sha target
            read -r ref_type ref_sha <<< "$1"
            target="$ref_sha"
            if [[ "$ref_type" == tag ]]; then
              target="$(git rev-parse --verify "$ref_sha^{commit}")"
            fi
            if [[ "$target" != "$RELEASE_COMMIT" ]]; then
              echo "::error::$tag points to a different commit. Investigate before releasing."
              exit 1
            fi
          }

          vercel_status="$(gh api "$repo/commits/$RELEASE_COMMIT/statuses?per_page=100" --jq '
            map(select(.creator.login == "vercel[bot]" and .context == "Vercel" and
                       ((.target_url // "") | startswith("https://vercel.com/zenocorp/zeno-house/"))))
            | first | if . == null then "" else [.state, .description] | @tsv end')"
          if [[ "$vercel_status" != $'success\tDeployment has completed' ]]; then
            echo "::error::The selected commit does not have a successful Vercel deployment."
            exit 1
          fi

          remote_tag="$(read_tag)"
          release="$(gh api --paginate "$repo/releases?per_page=100" --jq \
            ".[] | select(.tag_name == \"$tag\") | [.draft, .prerelease] | @tsv")"

          if [[ -n "$remote_tag" ]]; then
            verify_tag "$remote_tag"
          fi

          if [[ -n "$release" ]]; then
            if [[ -z "$remote_tag" || "$release" != $'false\tfalse' ]]; then
              echo "::error::$tag has a release without a matching tag, or is a draft or prerelease."
              exit 1
            fi
            echo "$tag is already published for $RELEASE_COMMIT."
            exit 0
          fi

          if [[ -z "$remote_tag" ]]; then
            gh api --method POST "$repo/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$RELEASE_COMMIT" > /dev/null
            verify_tag "$(read_tag)"
          fi

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$tag" --generate-notes --latest="$MARK_LATEST"
